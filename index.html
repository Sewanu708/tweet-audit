<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tweets Audit</title>
  <style>
    body { font-family: monospace; max-width: 720px; margin: 60px auto; padding: 0 20px; background: #0f0f0f; color: #e0e0e0; }
    h1 { font-size: 1.2rem; color: #fff; margin-bottom: 24px; }
    label { display: block; font-size: 0.8rem; color: #888; margin-bottom: 4px; }
    input[type="file"], input[type="text"] {
      width: 100%; box-sizing: border-box; background: #1a1a1a; border: 1px solid #333;
      color: #e0e0e0; padding: 8px 10px; border-radius: 4px; font-family: monospace; font-size: 0.85rem;
    }
    .field { margin-bottom: 16px; }
    button {
      background: #2563eb; color: #fff; border: none; padding: 9px 20px;
      border-radius: 4px; font-family: monospace; cursor: pointer; font-size: 0.85rem;
    }
    button:disabled { background: #333; color: #666; cursor: not-allowed; }
    #status { margin-top: 20px; font-size: 0.8rem; color: #888; }
    #status span { color: #4ade80; }
    #status .err { color: #f87171; }
    #output {
      margin-top: 16px; background: #1a1a1a; border: 1px solid #333; border-radius: 4px;
      max-height: 500px; overflow-y: auto; display: none;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th, td {
      padding: 8px 12px; text-align: left; border-bottom: 1px solid #333;
    }
    th { font-weight: bold; color: #aaa; font-size: 0.75rem; text-transform: uppercase; }
    td.flagged-true { color: #f87171; }
    td.flagged-false { color: #4ade80; }
    td.reason { color: #bbb; max-width: 300px; white-space: normal; word-break: break-word; }
    tr:last-child td { border-bottom: none; }
    .tweet-id { color: #60a5fa; }
    .tweet-id a { color: inherit; text-decoration: none; }
    .tweet-id a:hover { text-decoration: underline; 
    }
    #download { display: none; margin-top: 12px; }
    #download a {
      color: #60a5fa; text-decoration: none; font-size: 0.8rem;
    }
    #download a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>Tweets Audit</h1>

  <div class="field">
    <label>tweets.js file</label>
    <input type="file" id="fileInput" accept=".js,.zip,application/zip" />
  </div>

  <div class="field">
    <label>Prefix to strip (optional — e.g. <code>window.YTD.tweets.part0 = </code>)</label>
    <input type="text" id="prefix" placeholder="leave blank if not needed" />
  </div>

  <button type="button" id="submitBtn">Run audit</button>

  <hr style="border: 0; border-top: 1px solid #333; margin: 28px 0;" />

  <div class="field">
    <label>Track an existing Job ID</label>
    <input type="text" id="trackJobId" placeholder="e.g. f8bf05d6-a008-4746-bc2c-ef0941ffcf71" />
  </div>

  <button type="button" id="trackBtn">Track job</button>

  <div id="status"></div>
  <div id="output"></div>
  <div id="download"></div>

  <script>
    const BASE = 'http://localhost:8001';
    const btn = document.getElementById('submitBtn');
    const trackBtn = document.getElementById('trackBtn');
    const trackJobIdInput = document.getElementById('trackJobId');
    const statusEl = document.getElementById('status');
    const outputEl = document.getElementById('output');
    const downloadEl = document.getElementById('download');
    
    let pollInterval;

    function setStatus(msg, isError = false) {
      statusEl.innerHTML = isError
        ? `<span class="err">${msg}</span>`
        : `<span>${msg}</span>`;
    }

    function startPolling(taskId) {
      if (pollInterval) clearInterval(pollInterval);
      
      setStatus(`Job <span>${taskId}</span> queued. Waiting for processing to start...`);
      outputEl.style.display = 'block';
      outputEl.textContent = '';
      downloadEl.style.display = 'none';

      pollInterval = setInterval(async () => {
        try {
          const res = await fetch(`${BASE}/${taskId}/processed`);
          if (!res.ok) {
            setStatus(`Error fetching job status: ${res.statusText}`, true);
            clearInterval(pollInterval);
            btn.disabled = false;
            trackBtn.disabled = false;
            return;
          }
          const data = await res.json();

          if (data.status === 'completed' || data.status === 'failed') {
            clearInterval(pollInterval);
            btn.disabled = false;
            trackBtn.disabled = false;

            if (data.status === 'failed') {
              setStatus(`Job <span>${taskId}</span> failed. Reason: ${data.error || 'Unknown error'}`, true);
              return;
            }

            setStatus(`Processing complete for job <span>${taskId}</span>.`);
            renderResults(data.results);
            setupDownload(data.results);
          } else {
            setStatus(`Job <span>${taskId}</span> is ${data.status}...`);
          }
        } catch (e) {
          setStatus(`Polling error: ${e.message}`, true);
          clearInterval(pollInterval);
          btn.disabled = false;
          trackBtn.disabled = false;
        }
      }, 3000);
    }

    btn.addEventListener('click', async () => {
      const file = document.getElementById('fileInput').files[0];
      const prefix = document.getElementById('prefix').value.trim();

      if (!file) { setStatus('Select a file first.', true); return; }
      
      btn.disabled = true;
      trackBtn.disabled = true;
      outputEl.style.display = 'none';
      outputEl.textContent = '';
      downloadEl.style.display = 'none';
      setStatus(`Uploading <span>${file.name}</span>...`);
      
      const formData = new FormData();
      formData.append('file', file);
      if (prefix) {
        formData.append('prefix_to_strip', prefix);
      }

      let taskId;
      try {
        const res = await fetch(`${BASE}/upload`, { method: 'POST', body: formData });
        if (!res.ok) {
          const err = await res.json().catch(() => ({ detail: res.statusText }));
          throw new Error(err.detail ?? res.statusText);
        }
        const data = await res.json();
        taskId = data.task_id;
      } catch (e) {
        setStatus(`Upload failed: ${e.message}`, true);
        btn.disabled = false;
        trackBtn.disabled = false;
        return;
      }

      trackJobIdInput.value = taskId;
      startPolling(taskId);
    });

    trackBtn.addEventListener('click', () => {
      const taskId = trackJobIdInput.value.trim();
      if (!taskId) {
        setStatus('Enter a Job ID first.', true);
        return;
      }
      btn.disabled = true;
      trackBtn.disabled = true;
      startPolling(taskId);
    });

    function renderResults(results) {
      const tableHeader = `
        <table>
          <thead>
            <tr><th>Tweet ID</th><th>Flagged</th><th>Reason</th></tr>
          </thead>
          <tbody>
      `;
      const tableFooter = '</tbody></table>';
      const tableRows = results.map(r => `
        <tr>
          <td class="tweet-id"><a href="https://twitter.com/i/web/status/${r.id_str}" target="_blank">${r.id_str}</a></td>
          <td class="flagged-${r.flagged}">${r.flagged}</td>
          <td class="reason">${r.reason || 'N/A'}</td>
        </tr>
      `).join('');
      outputEl.innerHTML = tableHeader + tableRows + tableFooter;
    }

    function setupDownload(results) {
      const header = "id_str,flagged,reason\n";
      const csvRows = results.map(r => `${r.id_str},${r.flagged},"${(r.reason || '').replace(/"/g, '""')}"`);
      const blob = new Blob([header, ...csvRows].join('\n'), { type: 'text/csv' });
      const href = URL.createObjectURL(blob);
      downloadEl.innerHTML = `<a href="${href}" download="tweet_analysis.csv">Download CSV</a>`;
      downloadEl.style.display = 'block';
    }
  </script>
</body>
</html>
